name: Comptes initiaux

# Crée l'administrateur initial (et d'éventuels comptes de démonstration) sur le site déployé.
# Les mots de passe sont générés sur place et publiés uniquement chiffrés (clé publique fournie en entrée).
on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL du site"
        required: true
      comptes:
        description: "Identifiants séparés par des espaces (identifiant[:prénom[:niveau]])"
        required: true
      cle_publique:
        description: "Clé publique RSA (PEM encodé en base64) servant à chiffrer les mots de passe"
        required: true

jobs:
  creer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Créer les comptes
        run: |
          set -o pipefail
          { echo "# Comptes initiaux sur ${{ inputs.url }}"; echo '```'; node scripts/creer-comptes.mjs "${{ inputs.url }}" "${{ inputs.cle_publique }}" ${{ inputs.comptes }}; echo '```'; } | tee rapport.md
      - name: Publier le résultat (chiffré)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-report.mjs rapport.md "Comptes initiaux" "${{ job.status == 'success' && 'success' || 'failure' }}"
